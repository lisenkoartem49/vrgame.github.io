<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>VR Block Builder - v5.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cannon@0.6.2/build/cannon.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.8); z-index: 1000; }
        button { padding: 20px 40px; font-size: 24px; cursor: pointer; border-radius: 10px; border: none; background: #2ecc71; color: white; }
    </style>
</head>
<body>
    <div id="overlay">
        <button id="vr-btn">НАЖМИ, ЧТОБЫ ВОЙТИ В VR</button>
    </div>
    <script>
        let scene, camera, renderer, world, playerRig;
        let blocks = [], controllers = [];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x202025);
            camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 100);
            
            playerRig = new THREE.Group();
            playerRig.position.set(0, 0, 0);
            scene.add(playerRig);
            playerRig.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            world = new CANNON.World();
            world.gravity.set(0, -9.81, 0);

            // Floor
            const groundBody = new CANNON.Body({ mass: 0 });
            groundBody.addShape(new CANNON.Plane());
            groundBody.quaternion.setFromEuler(-Math.PI/2, 0, 0);
            world.addBody(groundBody);

            setupControllers();
            
            document.getElementById('vr-btn').addEventListener('click', async () => {
                const session = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] });
                await renderer.xr.setSession(session);
                document.getElementById('overlay').style.display = 'none';
            });

            renderer.setAnimationLoop(animate);
        }

        function setupControllers() {
            for(let i=0; i<2; i++) {
                const c = renderer.xr.getController(i);
                playerRig.add(c);
                controllers.push(c);

                const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.05), new THREE.MeshBasicMaterial({color: 0xffffff}));
                c.add(mesh);
            }
        }

        function animate() {
            world.step(1/60);
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
