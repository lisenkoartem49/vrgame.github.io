<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>VR Block Builder - v4.0</title>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
        button { padding: 30px 60px; font-size: 30px; cursor: pointer; border-radius: 20px; border: none; background: #2ecc71; color: white; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cannon@0.6.2/build/cannon.min.js"></script>
</head>
<body>
    <div id="overlay"><button id="vr-btn">ENTER VR</button></div>
    <script>
        let scene, camera, renderer, world, playerRig;
        let controllers = [], blocks = [], menuGroup = null;
        let isMenuOpen = false;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x101010);
            
            world = new CANNON.World();
            world.gravity.set(0, -9.81, 0);

            playerRig = new THREE.Group();
            scene.add(playerRig);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 1000);
            playerRig.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            const floorBody = new CANNON.Body({ mass: 0 });
            floorBody.addShape(new CANNON.Plane());
            floorBody.quaternion.setFromEuler(-Math.PI/2, 0, 0);
            world.addBody(floorBody);

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(50,50), new THREE.MeshBasicMaterial({color: 0x333333}));
            floor.rotation.x = -Math.PI/2;
            scene.add(floor);

            scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1));

            setupControllers();

            document.getElementById('vr-btn').addEventListener('click', async () => {
                const session = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] });
                await renderer.xr.setSession(session);
                document.getElementById('overlay').style.display = 'none';
            });

            renderer.setAnimationLoop(animate);
        }

        function setupControllers() {
            for(let i=0; i<2; i++) {
                const c = renderer.xr.getController(i);
                playerRig.add(c);
                controllers.push(c);
                const hand = new THREE.Mesh(new THREE.SphereGeometry(0.05), new THREE.MeshBasicMaterial({color: 0xffffff}));
                c.add(hand);
            }
        }

        function toggleMenu() {
            if(isMenuOpen) {
                scene.remove(menuGroup);
                menuGroup = null;
                isMenuOpen = false;
            } else {
                menuGroup = new THREE.Group();
                const panel = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 0.05), new THREE.MeshBasicMaterial({color: 0x555555}));
                panel.position.set(0, 0, -0.6);
                menuGroup.add(panel);

                const btn = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.1, 0.06), new THREE.MeshBasicMaterial({color: 0xff0000}));
                btn.position.set(0, 0, -0.55);
                btn.userData.isButton = true;
                menuGroup.add(btn);
                
                playerRig.add(menuGroup);
                isMenuOpen = true;
            }
        }

        function spawnBlock() {
            const block = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.2,0.2), new THREE.MeshBasicMaterial({color: 0xff0000}));
            const pos = new THREE.Vector3(0, 0, -1).applyMatrix4(camera.matrixWorld);
            scene.add(block);
            
            const body = new CANNON.Body({mass: 1});
            body.addShape(new CANNON.Box(new CANNON.Vec3(0.1, 0.1, 0.1)));
            body.position.set(pos.x, pos.y, pos.z);
            world.addBody(body);
            blocks.push({mesh: block, body: body});
        }

        function animate() {
            world.step(1/60);
            
            const session = renderer.xr.getSession();
            if (session) {
                session.inputSources.forEach(source => {
                    if (source.gamepad) {
                        const axes = source.gamepad.axes;
                        const buttons = source.gamepad.buttons;

                        if (source.handedness === 'right' && buttons[4]?.pressed && !window.cooldown) {
                            toggleMenu();
                            window.cooldown = true;
                            setTimeout(() => window.cooldown = false, 300);
                        }

                        if (source.handedness === 'left') {
                            playerRig.position.z += axes[3] * 0.05;
                            playerRig.position.x += axes[2] * 0.05;
                        } 
                        else if (source.handedness === 'right') {
                            playerRig.rotation.y -= axes[2] * 0.03;
                        }
                    }
                });
            }

            blocks.forEach(b => {
                b.mesh.position.copy(b.body.position);
                b.mesh.quaternion.copy(b.body.quaternion);
            });

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
